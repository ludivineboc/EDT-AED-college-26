<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Mon EDT AED</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Emploi du temps</div>
    <h1>Ludivine B.</h1>
    <div id="dateLabel"></div>
  </header>

  <div class="days" id="days"></div>

  <section class="panel">
    <div class="panel-head">
      <h2 id="dayTitle"></h2>
      <p id="daySubtitle"></p>
    </div>
    <div class="schedule" id="schedule"></div>
  </section>

  <div class="legend">Le créneau en cours est automatiquement mis en évidence.</div>
  <div class="footer">Les chevauchements sont conservés volontairement.</div>
</div>

</body>
</html>
